# Handgeschreven inventaris — dit bestand is leidend.
# De machine-exports in inventaris/export/ weten wél de ID's, maar niet waar
# iets hangt of wat je ermee wil. Dat zet je hier.
#
# Vul dit aan nadat je `make inventaris` hebt gedraaid.

huis:
  naam: ""
  adres_kort: "Waardenburg"   # voor weer/zonstand, geen volledig adres
  breedtegraad: 51.835
  lengtegraad: 5.251

# Overgenomen uit de Homey-zones (export 25-07)
verdiepingen:
  - naam: begane grond
    kamers: [entree, gang, woonkamer, keuken, studeerkamer]
  - naam: eerste verdieping
    kamers: [slaapkamer, overloop, badkamer]
  - naam: zolder
    kamers: [zolder]
  - naam: buiten
    kamers: [serre, tuin]

hubs:
  - naam: Homey Pro
    type: homey
    rol: "hub voor Zigbee / Z-Wave / 433 / Matter"
    ip: ""            # zie .env
  - naam: Somfy TaHoma
    type: tahoma
    rol: "zonwering en rolluiken"
    protocol: ""      # io-homecontrol of RTS — belangrijk, zie hieronder
  - naam: Apple TV
    type: appletv
    rol: "media in de woonkamer, tevens aanwezigheidssignaal"
    kamer: woonkamer

# Zonwering apart, omdat de details hier bepalend zijn voor wat mogelijk is.
zonwering:
  # Uit de Homey-export: dit scherm is al via de TaHoma-app aan Homey gekoppeld.
  - naam: Serre
    kamer: serre
    protocol: io       # io_horizontal_awning → statusterugkoppeling aanwezig
    orientatie: ONO    # kompas 67° (gemeten 25-07) → ochtend- en vroege middagzon
    orientatie_graden: 67
    type: binnenzonwering   # horizontaal scherm bínnen de serre (onder het glas)
    windgevoelig: false     # hangt binnen — geen windsensor nodig, geen noodrem
    opmerking: "Homey-device 352689c3; heeft ook 'my_value' (My-positie) en lock_state.
      Zon staat op deze gevel van zonsopgang tot ca. 13:30 (zonazimut > ~157° = vrij)."
  # Meer schermen? Die verschijnen in de TaHoma-export (make tahoma).

# Alles wat niet vanzelf uit een export komt, of waar je iets bij wil noteren.
#
# Ring-camera's: via de Amazon Ring-app aan Homey gekoppeld. Homey geeft ze
# klasse 'sensor' (niet 'camera'), dus het dashboard herkent ze aan de driver
# com.amazon.ring. De app levert GEEN videostream — alleen de capabilities
# hieronder. Zie docs/adr/0003-ring-cameras-dashboard.md voor de afweging.
apparaten:
  - naam: Front
    bron: homey
    kamer: Entree
    doel: "camera voordeur / oprit"
    driver: "com.amazon.ring:stickupcam"
    capabilities: [alarm_motion, measure_battery, flood_light, siren]
    opmerking: "Heeft floodlight. Geen live beeld via Homey."
  - naam: Backyard
    bron: homey
    kamer: Tuin
    doel: "camera achtertuin"
    driver: "com.amazon.ring:stickupcam"
    capabilities: [alarm_motion, measure_battery, flood_light, siren]
    opmerking: "Heeft floodlight. Geen live beeld via Homey."
  - naam: Woonkamer
    bron: homey
    kamer: Woonkamer
    doel: "camera binnen"
    driver: "com.amazon.ring:stickupcam"
    capabilities: [alarm_motion, siren]
    opmerking: "Binnencamera: geen batterij- of floodlight-capability. Geen live beeld via Homey."
  # Sjabloon voor nieuwe regels:
  # - naam: ""
  #   bron: homey        # homey | tahoma | appletv | los
  #   kamer: ""
  #   doel: ""           # waar gebruik je het voor
  #   opmerking: ""
